          curl --fail --location --silent --show-error --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/06b08917-b481-42d7-84fa-c7d72b3eedf0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2EwOGE5MTQwYmQyM2QwMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoImV4cCI6MTc5NDA2MzEyNH0.fhvmDvJAIAU88xNN_zrA5lv5_dEV5VOE3aXPuaUrGNA' --output 'projetos/preventivo/imagens/10-dashboard-pendentes.png'
          file 'projetos/preventivo/imagens/10-dashboard-pendentes.png' | grep -q 'PNG image data'
      - name: Registrar imagens no portfólio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projetos/preventivo/imagens/*.png
          git diff --cached --quiet || (git commit -m "docs: publica capturas editadas e aprovadas do Preventivo" && git push)
