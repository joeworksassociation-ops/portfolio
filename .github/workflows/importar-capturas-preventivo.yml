name: Importar capturas editadas do Preventivo
on:
  push:
    paths:
      - .github/workflows/importar-capturas-preventivo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar-capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar os prints aprovados sem recriação
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projetos/preventivo/imagens
          curl --fail --location --silent --show-error --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/36816532-fe17-417c-abff-61f4ce17d63d.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNmNlOTJhNTMxNGEwYTdkNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDA0MjQ1MX0.XBXSDXHy0kMjfgB-2k8SpJEaDapRqvD-PxA5a6rMLjM' --output 'projetos/preventivo/imagens/01-acordo-nao-pago.png'
          file 'projetos/preventivo/imagens/01-acordo-nao-pago.png' | grep -q 'PNG image data'
          curl --fail --location --silent --show-error --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/1694b966-7121-41e1-a331-43c618912086.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzlkZDM1MDEyMzAzNzI5YyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDAxOTg0MX0.FjLxYLxjBJ-ydhvtk4nPsV6zQhdh1bW27iieijS3MBY' --output 'projetos/preventivo/imagens/02-acordo-pago.png'
          file 'projetos/preventivo/imagens/02-acordo-pago.png' | grep -q 'PNG image data'
          curl --fail --location --silent --show-error --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/9b8b27a1-521d-4877-9164-a23b7b9760b3.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOGNlYTQyMTgyMTE3NDhmMCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoImV4cCI6MTc5NDAwODk4NH0.p5pJjXgZEw_07HZI3bhetgAcnpe5rd09ZzIQc2vbklQ' --output 'projetos/preventivo/imagens/03-cadastro-com-calendario.png'
