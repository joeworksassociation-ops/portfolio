name: Teste temporário de acesso a mídia
on:
  push:
    paths: ['.github/workflows/teste-midia-temporario.yml']
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar acesso
        env:
          MEDIA_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:110/quality:100/uri:ifs%3A%2F%2FM%2Fcbe388e2-dadf-40af-9cc6-e72ec27bc025/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAPz2P9SVplZEqb7ssbwJL8O3hTI-Una8Vdxu0ZCGV21S&exp=1793937844&osig=AAAAAAAAAAAAAAAAAAAAACjP3F-I5jTdpkTzVTJ350DL0_HxGodC1YLcVTOpMqFD&signer=media-rpc&token=AAIAAU0AJGNiZTM4OGUyLWRhZGYtNDBhZi05Y2M2LWU3MmVjMjdiYzAyNQAAAAABoa8HJyDQEtFO2XfehFKdx39Subt3hRbwlX39mTkkeRDBqZFqYA&x-canva-quality=thumbnail'
        run: |
          curl --retry 1 --fail --location --silent --show-error -o /tmp/teste.png "$MEDIA_URL"
          file /tmp/teste.png
          wc -c /tmp/teste.png
